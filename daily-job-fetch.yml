name: Daily Healthcare Job Fetch

# Runs automatically every day for free using GitHub Actions.
# Adjust the cron schedule below (UTC time!) to whenever you want it to run.
# Example: "30 2 * * *" = 2:30 AM UTC = 8:00 AM IST

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:  # lets you also trigger it manually from the Actions tab

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run job fetch script
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python healthcare_job_alerts.py

      - name: Commit updated output file
        run: |
          git config --global user.name "job-bot"
          git config --global user.email "job-bot@users.noreply.github.com"
          git add jobs_output.txt
          git commit -m "Daily job update" || echo "No changes to commit"
          git push
